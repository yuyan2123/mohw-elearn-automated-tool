<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看如何開始學習、接續教材並確認已入帳的閱讀時數。">
  <title>使用教學 | e 學園學習助手</title>
  <link rel="stylesheet" href="extension-pages.css">
</head>
<body class="document">
  <main class="sheet">
    <h1>使用教學</h1>
    <div class="guide-layout">
      <ol class="steps">
        <li>
          <h2>登入並進入課程</h2>
          <p>在衛生福利 e 學園的課程資訊頁按「上課去」。學習助手會出現在教室左側。</p>
        </li>
        <li>
          <h2>按「開始學習」</h2>
          <p>保持課程分頁在畫面上。若影片沒有自動播放，請按影片上的播放鍵。看完影片會自動結算並接續，這個選項可取消。</p>
          <p>檔案讀完後，可按「結算並看下一篇」。</p>
        </li>
        <li>
          <h2>查看已入帳時數</h2>
          <p>準備離開時，按「結算並查看時數」。請以課程資訊頁顯示的時數和完課條件為準。</p>
        </li>
      </ol>
      <figure class="guide-image">
        <img src="assets/study-panel.png" alt="教室左側的學習助手。面板上方顯示已入帳和閱讀門檻，下方有「開始學習」按鈕。" width="284" height="258">
        <figcaption>教室左側的面板，時數為示範。</figcaption>
      </figure>
    </div>
    <section class="support-note">
      <h2>時數沒有顯示？</h2>
      <p>按面板上的「讀取平臺時數」重試。若看不到面板，請從課程資訊頁重新進入教室。</p>
    </section>
  </main>
</body>
</html>
